<!-- Craft preset: spinner, skeleton, progress -->
<style>
  .craft-spinner {
    width: 1.5rem;
    height: 1.5rem;
    border: 2px solid #e4e4e7;
    border-top-color: #111;
    border-radius: 50%;
    animation: craft-spin 0.75s linear infinite;
  }
  .craft-skel {
    display: block;
    background: linear-gradient(90deg, #ececef 0%, #f7f7f8 50%, #ececef 100%);
    background-size: 200% 100%;
    animation: craft-shimmer 1.4s ease infinite;
    border-radius: 8px;
  }
  .craft-skel-line { height: 0.75rem; width: 100%; margin: 0 0 0.5rem; }
  .craft-skel-short { width: 62%; }
  .craft-skel-block { height: 6rem; width: 100%; margin: 0 0 0.75rem; }
  .craft-skel-circle { width: 2.25rem; height: 2.25rem; border-radius: 999px; flex-shrink: 0; }
  .craft-skel-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
  .craft-skel-copy { flex: 1; min-width: 0; }
  .craft-progress {
    display: grid;
    gap: 0.5rem;
    width: min(100%, 16rem);
  }
  .craft-progress-track {
    height: 0.5rem;
    border-radius: 999px;
    background: #ececef;
    overflow: hidden;
  }
  .craft-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: #111;
    transition: width 0.2s ease;
  }
  .craft-progress-pct {
    font-size: 0.8rem;
    color: #5c5c5c;
    font-variant-numeric: tabular-nums;
  }
  @keyframes craft-spin { to { transform: rotate(360deg); } }
  @keyframes craft-shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .craft-spinner, .craft-skel { animation: none; }
  }
</style>

<div class="craft-spinner" role="status" aria-label="Loading"></div>

<div aria-hidden="true">
  <div class="craft-skel-row">
    <span class="craft-skel craft-skel-circle"></span>
    <div class="craft-skel-copy">
      <span class="craft-skel craft-skel-line"></span>
      <span class="craft-skel craft-skel-line craft-skel-short"></span>
    </div>
  </div>
  <span class="craft-skel craft-skel-block"></span>
  <span class="craft-skel craft-skel-line"></span>
  <span class="craft-skel craft-skel-line craft-skel-short"></span>
</div>

<div class="craft-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">
  <div class="craft-progress-track"><div class="craft-progress-fill" style="width:42%"></div></div>
  <span class="craft-progress-pct">42%</span>
</div>
