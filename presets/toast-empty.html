<!-- Craft preset: toast + empty state -->
<style>
  .craft-toast {
    position: fixed;
    left: 50%;
    bottom: 1.25rem;
    transform: translateX(-50%);
    z-index: 80;
    min-height: 2.5rem;
    padding: 0.65rem 1rem;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 550;
    box-shadow: 0 10px 28px rgb(0 0 0 / 18%);
  }
  .craft-empty {
    display: grid;
    gap: 0.55rem;
    justify-items: center;
    text-align: center;
    padding: 1.75rem 1.15rem;
    border-radius: 18px;
    background: #f7f7f8;
    border: 1px dashed #d4d4d8;
  }
  .craft-empty strong {
    font-size: 1rem;
    letter-spacing: -0.02em;
    color: #111;
  }
  .craft-empty p {
    margin: 0;
    max-width: 22rem;
    font-size: 0.9rem;
    line-height: 1.45;
    color: #5c5c5c;
  }
  .craft-empty .craft-btn {
    margin-top: 0.35rem;
  }
</style>

<div class="craft-empty" role="status">
  <strong>No projects yet</strong>
  <p>When you claim a lead and build a site, it will show up here.</p>
  <button type="button" class="craft-btn craft-btn-primary">Open Builder</button>
</div>

<!-- Example toast; mount near document body and remove after ~2s -->
<div class="craft-toast" role="status" aria-live="polite">Saved</div>
