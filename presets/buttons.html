<!-- Craft preset: buttons (primary, secondary, ghost, danger, loading) -->
<style>
  .craft-btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    letter-spacing: -0.015em;
    border-radius: 999px;
    min-height: 44px;
    padding: 0 1.2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition:
      transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.22s ease,
      background 0.15s ease,
      opacity 0.15s ease;
    transform-origin: center;
  }
  .craft-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }
  .craft-btn-primary {
    background: #111;
    color: #fff;
  }
  .craft-btn-primary:hover:not(:disabled) {
    transform: scale(1.03);
    box-shadow: 0 4px 14px rgb(0 0 0 / 12%);
  }
  .craft-btn-primary:active:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgb(0 0 0 / 14%);
  }
  .craft-btn-secondary {
    background: #fff;
    color: #111;
    box-shadow: inset 0 0 0 1px #cfcfcf;
  }
  .craft-btn-secondary:hover:not(:disabled) {
    background: #f5f5f5;
  }
  .craft-btn-ghost {
    background: transparent;
    color: #52525b;
    box-shadow: inset 0 0 0 1px #e4e4e7;
  }
  .craft-btn-ghost:hover:not(:disabled) {
    background: #f5f5f5;
    color: #111;
  }
  .craft-btn-danger {
    background: #d92d20;
    color: #fff;
  }
  .craft-btn.is-loading {
    pointer-events: none;
  }
  .craft-btn-spin {
    width: 1rem;
    height: 1rem;
    border: 2px solid rgb(255 255 255 / 35%);
    border-top-color: #fff;
    border-radius: 50%;
    animation: craft-spin 0.7s linear infinite;
  }
  @keyframes craft-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .craft-btn { transition: none; }
    .craft-btn-spin { animation: none; border-top-color: #fff; }
  }
</style>

<button type="button" class="craft-btn craft-btn-primary">Save changes</button>
<button type="button" class="craft-btn craft-btn-secondary">Cancel</button>
<button type="button" class="craft-btn craft-btn-ghost">Learn more</button>
<button type="button" class="craft-btn craft-btn-danger">Delete</button>
<button type="button" class="craft-btn craft-btn-primary is-loading" aria-busy="true" disabled>
  <span class="craft-btn-spin" aria-hidden="true"></span>
  Saving
</button>
