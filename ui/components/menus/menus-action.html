<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action menu — Menus — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Menus (menus)
  Type: Action menu
  Id: menus-action
  Classes: dt-stage, is-live, dt-dropdown, dt-dropdown-end, dt-icon-btn, dt-dropdown-menu, is-danger
  Elements: button, svg, circle, ul, li
  States: is-live, is-danger
  Data: data-dropdown
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#menus-action
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/menus/menus-action.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <div class="dt-dropdown dt-dropdown-end" data-dropdown>
                <button type="button" class="dt-icon-btn" aria-expanded="false" aria-haspopup="menu" aria-label="Actions">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
                <ul class="dt-dropdown-menu" role="menu" hidden>
                  <li role="menuitem" tabindex="-1">Duplicate</li>
                  <li role="menuitem" tabindex="-1">Rename</li>
                  <li role="menuitem" tabindex="-1" class="is-danger">Delete</li>
                </ul>
              </div>
            </div>

</div>
</body>
</html>
