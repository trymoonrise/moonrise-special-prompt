<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiple choice — Radio groups — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Radio groups (radio-groups)
  Type: Multiple choice
  Id: choice-quiz
  Classes: dt-stage, is-live, dt-quiz-q, dt-quiz-opt, dt-quiz-feedback
  Elements: p, button
  States: is-live
  Data: data-quiz, data-quiz-opt, data-correct, data-quiz-feedback
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#choice-quiz
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/radio-groups/choice-quiz.html
-->
<div class="dt-ref">
<div class="dt-stage is-live" data-quiz>
              <p class="dt-quiz-q">Which loader fits unknown content shape?</p>
              <button type="button" class="dt-quiz-opt" data-quiz-opt data-correct="0">Skeleton</button>
              <button type="button" class="dt-quiz-opt" data-quiz-opt data-correct="1">Spinner</button>
              <button type="button" class="dt-quiz-opt" data-quiz-opt data-correct="0">Progress bar</button>
              <p class="dt-quiz-feedback" data-quiz-feedback hidden></p>
            </div>

</div>
</body>
</html>
