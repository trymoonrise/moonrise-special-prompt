<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel — Carousels — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Carousels (carousels)
  Type: Carousel
  Id: media-carousel
  Classes: dt-stage, is-live, dt-carousel, dt-carousel-track, dt-carousel-slide, dt-carousel-progress, is-active
  Elements: button
  States: is-live, is-active
  Data: data-carousel, data-carousel-dots
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#media-carousel
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/carousels/media-carousel.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <div class="dt-carousel" data-carousel>
                <div class="dt-carousel-track">
                  <div class="dt-carousel-slide" style="background:#f3f3f3">Slide 1</div>
                  <div class="dt-carousel-slide" style="background:#ececef">Slide 2</div>
                  <div class="dt-carousel-slide" style="background:#e8e8e8">Slide 3</div>
                </div>
              </div>
              <div class="dt-carousel-progress" data-carousel-dots>
                <button type="button" class="is-active" aria-label="Slide 1"><span></span></button>
                <button type="button" aria-label="Slide 2"><span></span></button>
                <button type="button" aria-label="Slide 3"><span></span></button>
              </div>
            </div>

</div>
</body>
</html>
