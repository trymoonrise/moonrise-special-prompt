<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Form — Popovers — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Popovers (popovers)
  Type: Form
  Id: pop-form
  Classes: dt-stage, lx-stretch, lx-pop, lx-field, is-focus, lx-input-wrap, lx-btn, is-compact
  Elements: label, input, button
  States: is-focus, is-compact
  Data: none
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#pop-form
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/popovers/pop-form.html
-->
<div class="dt-ref">
<div class="dt-stage lx-stretch"><div class="lx-pop"><label class="lx-field is-focus"><span>Name</span><span class="lx-input-wrap"><input placeholder="Studio name" aria-label="Name"></span></label><button type="button" class="lx-btn is-compact">Save</button></div></div>

</div>
</body>
</html>
