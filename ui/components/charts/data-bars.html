<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparison bars — Charts — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Charts (charts)
  Type: Comparison bars
  Id: data-bars
  Classes: dt-stage, dt-bars, dt-bar-row, dt-bar-track, dt-bar-fill
  Elements: container
  States: rest
  Data: data-demo, data-stage-tap, data-bars
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#data-bars
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/charts/data-bars.html
-->
<div class="dt-ref">
<div class="dt-stage" data-demo="bars" data-stage-tap="bars">
              <div class="dt-bars" data-bars>
                <div class="dt-bar-row" style="--dt-bar:78%"><span>Leads</span><div class="dt-bar-track"><div class="dt-bar-fill"></div></div><span>78</span></div>
                <div class="dt-bar-row" style="--dt-bar:54%"><span>Sites</span><div class="dt-bar-track"><div class="dt-bar-fill"></div></div><span>54</span></div>
                <div class="dt-bar-row" style="--dt-bar:33%"><span>Live</span><div class="dt-bar-track"><div class="dt-bar-fill"></div></div><span>33</span></div>
              </div>
            </div>

</div>
</body>
</html>
