<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom sheet — Dialogs — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Dialogs (dialogs)
  Type: Bottom sheet
  Id: menus-sheet
  Classes: dt-stage, is-live, dt-stage-row, dt-btn, dt-btn-secondary, dt-overlay, dt-overlay-sheet, dt-sheet, dt-sheet-handle, dt-sheet-row
  Elements: button, h3
  States: is-live, dt-btn-secondary
  Data: data-open-sheet, data-close-overlay
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#menus-sheet
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/dialogs/menus-sheet.html
-->
<div class="dt-ref">
<div class="dt-stage is-live dt-stage-row">
              <button type="button" class="dt-btn dt-btn-secondary" data-open-sheet>Open sheet</button>
            </div>
<div class="dt-overlay dt-overlay-sheet" id="dt-sheet">
    <div class="dt-sheet" role="dialog" aria-modal="true" aria-labelledby="dt-sheet-title">
      <div class="dt-sheet-handle" aria-hidden="true"></div>
      <h3 id="dt-sheet-title">Share options</h3>
      <button type="button" class="dt-sheet-row">Copy link</button>
      <button type="button" class="dt-sheet-row">Send email</button>
      <button type="button" class="dt-sheet-row" data-close-overlay>Close</button>
    </div>
  </div>
</div>
</body>
</html>
