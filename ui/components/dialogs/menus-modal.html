<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal — Dialogs — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Dialogs (dialogs)
  Type: Modal
  Id: menus-modal
  Classes: dt-stage, is-live, dt-stage-row, dt-btn, dt-btn-primary, dt-overlay, dt-modal, dt-actions, dt-btn-ghost
  Elements: button, h3, p
  States: is-live, dt-btn-ghost
  Data: data-open-modal, data-close-overlay
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#menus-modal
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/dialogs/menus-modal.html
-->
<div class="dt-ref">
<div class="dt-stage is-live dt-stage-row">
              <button type="button" class="dt-btn dt-btn-primary" data-open-modal>Open modal</button>
            </div>
<div class="dt-overlay" id="dt-modal">
    <div class="dt-modal" role="dialog" aria-modal="true" aria-labelledby="dt-modal-title">
      <h3 id="dt-modal-title">Publish site?</h3>
      <p>This sends the live link to your client with the watermark checkout.</p>
      <div class="dt-actions">
        <button type="button" class="dt-btn dt-btn-ghost" data-close-overlay>Cancel</button>
        <button type="button" class="dt-btn dt-btn-primary" data-close-overlay>Publish</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
