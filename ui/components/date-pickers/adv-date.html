<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date picker UI — Date pickers — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Date pickers (date-pickers)
  Type: Date picker UI
  Id: adv-date
  Classes: dt-stage, is-live, dt-date, dt-date-head, dt-date-grid, is-selected
  Elements: button
  States: is-live, is-selected
  Data: data-date
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#adv-date
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/date-pickers/adv-date.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <div class="dt-date" data-date>
                <div class="dt-date-head">November 2026</div>
                <div class="dt-date-grid">
                  <button type="button">1</button><button type="button">2</button><button type="button">3</button>
                  <button type="button">4</button><button type="button">5</button><button type="button">6</button>
                  <button type="button" class="is-selected">7</button><button type="button">8</button><button type="button">9</button>
                </div>
              </div>
            </div>

</div>
</body>
</html>
