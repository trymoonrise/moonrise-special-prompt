<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented control — Toggles — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Toggles (toggles)
  Type: Segmented control
  Id: forms-segmented
  Classes: dt-stage, is-live, dt-segment, dt-pill-thumb, is-active
  Elements: button
  States: is-live, is-active
  Data: data-pill-track, data-seg
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#forms-segmented
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/toggles/forms-segmented.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <div class="dt-segment" role="tablist" aria-label="Mode" data-pill-track>
                <span class="dt-pill-thumb" aria-hidden="true"></span>
                <button type="button" class="is-active" data-seg>Edit</button>
                <button type="button" data-seg>Preview</button>
                <button type="button" data-seg>Code</button>
              </div>
            </div>

</div>
</body>
</html>
