<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danger — Buttons — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Buttons (buttons)
  Type: Danger
  Id: buttons-danger
  Classes: dt-stage, dt-danger-flow, dt-btn, dt-btn-danger, dt-danger-confirm, dt-actions, dt-btn-ghost
  Elements: button, p
  States: dt-btn-danger, dt-btn-ghost
  Data: data-danger-flow, data-danger-trigger, data-danger-confirm, data-danger-cancel, data-danger-yes
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#buttons-danger
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/buttons/buttons-danger.html
-->
<div class="dt-ref">
<div class="dt-stage">
              <div class="dt-danger-flow" data-danger-flow>
                <button type="button" class="dt-btn dt-btn-danger" data-danger-trigger>Delete project</button>
                <div class="dt-danger-confirm" data-danger-confirm hidden>
                  <p>Delete this project? This cannot be undone.</p>
                  <div class="dt-actions">
                    <button type="button" class="dt-btn dt-btn-ghost" data-danger-cancel>Cancel</button>
                    <button type="button" class="dt-btn dt-btn-danger" data-danger-yes>Delete</button>
                  </div>
                </div>
              </div>
            </div>

</div>
</body>
</html>
