<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — Pagination — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Pagination (pagination)
  Type: Pagination
  Id: nav-pagination
  Classes: dt-stage, is-live, dt-stage-row, dt-page-btn, is-active
  Elements: button, svg, path
  States: is-live, is-active
  Data: data-pager, data-pager-prev, data-pager-next
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#nav-pagination
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/pagination/nav-pagination.html
-->
<div class="dt-ref">
<div class="dt-stage is-live dt-stage-row" data-pager>
              <button type="button" class="dt-page-btn" data-pager-prev aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
              <button type="button" class="dt-page-btn is-active">1</button>
              <button type="button" class="dt-page-btn">2</button>
              <button type="button" class="dt-page-btn">3</button>
              <button type="button" class="dt-page-btn" data-pager-next aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
            </div>

</div>
</body>
</html>
