<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password reveal — Inputs — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Inputs (inputs)
  Type: Password reveal
  Id: forms-password
  Classes: dt-stage, is-live, dt-stage-form, dt-label, dt-pass-wrap, dt-field, dt-pass-wipe, dt-pass-toggle, dt-eye, dt-eye-off
  Elements: label, input, button, svg, path, circle
  States: is-live
  Data: data-pass-toggle
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#forms-password
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/inputs/forms-password.html
-->
<div class="dt-ref">
<div class="dt-stage is-live dt-stage-form">
              <label class="dt-label" for="dt-pass">Password</label>
              <div class="dt-pass-wrap">
                <input class="dt-field" id="dt-pass" type="password" value="moonrise123" autocomplete="off">
                <span class="dt-pass-wipe" aria-hidden="true"></span>
                <button type="button" class="dt-pass-toggle" data-pass-toggle aria-label="Show password" aria-pressed="false">
                  <svg class="dt-eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
                  <svg class="dt-eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4.2"/><path d="M6.1 6.1C3.8 7.8 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.2 3.6-.7"/></svg>
                </button>
              </div>
            </div>

</div>
</body>
</html>
