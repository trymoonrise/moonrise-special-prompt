<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom dropdown — Dropdowns — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Components
  Category: Dropdowns (dropdowns)
  Type: Custom dropdown
  Id: menus-dropdown
  Classes: dt-stage, is-live, dt-dropdown, dt-dropdown-trigger, dt-dropdown-menu
  Elements: button, svg, path, ul, li
  States: is-live
  Data: data-dropdown, data-dropdown-label
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#menus-dropdown
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/components/dropdowns/menus-dropdown.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <div class="dt-dropdown" data-dropdown>
                <button type="button" class="dt-dropdown-trigger" aria-expanded="false" aria-haspopup="listbox">
                  <span data-dropdown-label>Choose industry</span>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <ul class="dt-dropdown-menu" role="listbox" hidden>
                  <li role="option" tabindex="-1">Restaurants</li>
                  <li role="option" tabindex="-1">Dentists</li>
                  <li role="option" tabindex="-1">Gyms</li>
                  <li role="option" tabindex="-1">Salons</li>
                </ul>
              </div>
            </div>

</div>
</body>
</html>
