<!DOCTYPE html>
<html lang="en">
<head>

<title>Wizard — Form systems — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Screens
  Category: Form systems (form-systems)
  Type: Wizard
  Id: fsys-wizard
  Classes: dt-stage, lx-stretch, lx-tall, lx-kicker, lx-field, is-focus, lx-input-wrap, lx-actions, lx-btn, lx-btn-ghost
  Elements: p, label, input, button
  States: is-focus, lx-btn-ghost
  Data: none
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#fsys-wizard
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/screens/form-systems/fsys-wizard.html
-->
<div class="dt-ref">
<div class="dt-stage lx-stretch lx-tall"><p class="lx-kicker">Step 2 of 3</p><label class="lx-field is-focus"><span>Hours</span><span class="lx-input-wrap"><input value="7–5" placeholder="Studio name" aria-label="Hours"></span></label><div class="lx-actions"><button type="button" class="lx-btn lx-btn-ghost">Back</button><button type="button" class="lx-btn">Next</button></div></div>

</div>
</body>
