<!DOCTYPE html>
<html lang="en">
<head>

<title>Infinite scroll — Loading states — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Screens
  Category: Loading states (loading-states)
  Type: Infinite scroll
  Id: loaders-infinite
  Classes: dt-stage, dt-stage-scroll, dt-feed, dt-infinite-sentinel, dt-spinner, dt-spinner-sm
  Elements: container
  States: rest
  Data: data-demo
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#loaders-infinite
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/screens/loading-states/loaders-infinite.html
-->
<div class="dt-ref">
<div class="dt-stage dt-stage-scroll" data-demo="infinite" id="dt-infinite-viewport">
              <div class="dt-feed" id="dt-infinite-feed"></div>
              <div class="dt-infinite-sentinel" id="dt-infinite-sentinel" aria-hidden="true">
                <span class="dt-spinner dt-spinner-sm"></span>
              </div>
            </div>

</div>
</body>
