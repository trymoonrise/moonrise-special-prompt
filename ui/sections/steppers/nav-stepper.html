<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper — Steppers — Moonrise UI</title>
<link rel="stylesheet" href="../../css/ui-library.css">
<link rel="stylesheet" href="../../css/ui-library-lab.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;box-sizing:border-box;background:#f7f7f8}
.dt-ref{width:min(28rem,100%)}
.dt-ref .dt-overlay{position:relative;inset:auto;margin-top:16px;min-height:16rem;border-radius:14px}
.dt-ref .dt-overlay[hidden]{display:grid!important}
</style>
</head>
<body data-page="ui-library" class="dt-page dt-ref-page">
<!--
  Group: Sections
  Category: Steppers (steppers)
  Type: Stepper
  Id: nav-stepper
  Classes: dt-stage, is-live, dt-stepper, is-done, dt-step-node, dt-step-name, is-current, dt-step-current, dt-actions, dt-actions-keep, dt-play, dt-play-ghost
  Elements: ol, li, p, button
  States: is-live, is-done, is-current
  Data: data-stepper, data-step-label, data-play
  CSS: ui/css/ui-library.css, ui/css/ui-library-lab.css
  Tokens: ink #111, muted #5c5c5c, quiet #8a8a8a, line #ebebeb, fill #f4f4f5, surface #fff, stage #f7f7f8, action #1f6fed, danger #d92d20, ok #067647, radius 18/14.
  Keep this structure and these states. Change colors and labels only. Do not redraw the control.
  Library: https://trymoonrise.com/ui-library#nav-stepper
  Repo: https://github.com/trymoonrise/moonrise-special-prompt/blob/main/ui/sections/steppers/nav-stepper.html
-->
<div class="dt-ref">
<div class="dt-stage is-live">
              <ol class="dt-stepper" data-stepper>
                <li class="is-done"><span class="dt-step-node" aria-hidden="true"></span><span class="dt-step-name">Details</span></li>
                <li class="is-current"><span class="dt-step-node" aria-hidden="true"></span><span class="dt-step-name">Design</span></li>
                <li><span class="dt-step-node" aria-hidden="true"></span><span class="dt-step-name">Publish</span></li>
              </ol>
              <p class="dt-step-current" data-step-label>Design</p>
              <div class="dt-actions dt-actions-keep">
                <button type="button" class="dt-play dt-play-ghost" data-play="step-back">Back</button>
                <button type="button" class="dt-play" data-play="step-next">Next</button>
              </div>
            </div>

</div>
</body>
</html>
